[package]
name = "sonar"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
anyhow = "1.0.100"
async-trait = "0.1.89"

chrono = "0.4.42"
indexmap = "2.11.4"
reqwest = { version = "0.12.24", features = ["rustls-tls", "json"], default-features = false }
sysinfo = "0.37.2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
clap = { version = "4.5.49", features = ["derive", "env"] }
dotenv = "0.15.0"
toml = "0.9"
humantime-serde = "1.1"  # For parsing durations like "1m", "12h"
regex = "1.12.2"
serde_yaml = "0.9.34"
